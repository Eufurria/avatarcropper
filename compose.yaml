# Local testing uses the dev stage (Parcel). Deployment uses the production
# stage (nginx). Start dev with: docker compose up
# Start the deployment image with: docker compose --profile prod up

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "127.0.0.1:1234:1234"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - /app/node_modules
      - parcel-cache:/app/.parcel-cache
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:1234/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8085:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  parcel-cache:
